[[entities]]
name = "Stelle"
    [entities.transform]
    position = [0, 0, 0]
    rotation = [0, 0, 0, 1]
    scale    = [1, 1, 1]
    [entities.renderObject]
    uri = "file:asset/Stelle/Stelle.pmx"
    renderType = "type0"
    [entities.script]
    monoScripts = ["MoveComponent"]
[[entities]]
name = "Camera"
    [entities.transform]
    position = [0, 10, 30]
    rotation = [0,  0,  0, 1]
    scale    = [1,  1,  1]
    [entities.camera]
    # 45°
    fov = 0.7853981625
    nearPlane = 0.1
    farPlane = 100.0
    projection = "perspective"
[[entities]]
name = "Floor"
    [entities.transform]
    position = [0, -0.5, 0]
    rotation = [0, 0, 0, 1]
    scale    = [100, 1, 100]
    [entities.renderObject]
    uri = "embedded:cube"
    renderType = "type0"
        [[entities.renderObject.material_override]]
        baseColor = "asset/metal1.png"
        targetSlot = "default"
    [entities.boxCollider]
    position = [0, 0, 0]
    rotation = [0, 0, 0, 1]
    scale    = [1, 1, 1]
